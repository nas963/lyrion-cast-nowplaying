<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LMS Now Playing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root { --fg: #fff; --fg2: rgba(255,255,255,.72); --fg3: rgba(255,255,255,.55); --accent: #e0835a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; color: var(--fg);
    font-family: Roboto, "Noto Sans", Arial, sans-serif; }
  #bg, #bg2 { position: absolute; inset: -6vh; background-size: cover; background-position: center;
    filter: blur(60px) saturate(1.3) brightness(.45); transition: opacity 1.2s; }
  #shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 65% 75%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 70%); }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; padding: 4.5vh 4vw; gap: 4vw;
    transition: transform 2s; }
  #art { height: 91vh; width: 91vh; flex: none; border-radius: 1vh; object-fit: cover;
    box-shadow: 0 2vh 6vh rgba(0,0,0,.6); background: #222; transition: opacity .6s; }
  #side { flex: 1; min-width: 0; height: 91vh; display: flex; flex-direction: column; }
  #meta { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; gap: 3.2vh; }
  #title { font-size: 5.6vh; font-weight: 500; line-height: 1.15; }
  #artist, #album { font-size: 4.2vh; color: var(--fg2); line-height: 1.2; }
  .pre { font-size: .72em; color: var(--fg3); margin-right: .3em; }
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  #info { text-align: center; font-size: 1.9vh; color: var(--fg2); margin-bottom: 1.4vh; min-height: 2.4vh; }
  #bar { display: flex; align-items: center; gap: 1.6vw; font-size: 2.1vh; color: var(--fg2); font-variant-numeric: tabular-nums; }
  #track { flex: 1; height: .6vh; border-radius: .3vh; background: rgba(255,255,255,.18); overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); }
  #bar.noprog #track, #bar.noprog #dur { visibility: hidden; }
  /* lokalni fajl sa talasnim oblikom (Waveform plugin): talas umesto trake, odsvirani deo u boji */
  #fwave { display: none; flex: 1; min-width: 0; height: 5.5vh; }
  body.fwave #track { display: none; }
  body.fwave #fwave { display: block; }
  body.fwave #bar.noprog #fwave { visibility: hidden; }
  /* VU metar (plugin VUMeter): izmedju podataka o pesmi i trake / CD displeja */
  #vu { display: none; flex: none; width: 100%; margin-bottom: 2.6vh; }
  body.vu #vu { display: block; }
  body.vu.vu-needles #vu { height: 21vh; }
  body.vu.vu-bars #vu { height: 8vh; }
  body.vu.cd.vu-needles #vu { height: 17vh; }
  #paused { position: absolute; top: 4vh; right: 4vw; font-size: 2vh; letter-spacing: .3em; color: var(--fg3);
    opacity: 0; transition: opacity .4s; }
  body.paused #paused { opacity: 1; }
  body.paused #fill { background: var(--fg3); }
  #idle { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 3vh; color: var(--fg3); }
  body.idle #stage, body.idle #bg, body.idle #bg2 { display: none; }
  body.idle #idle { display: flex; }

  /* audio CD: same cover and text; a CD-player style display takes the place of the progress bar */
  #lcd { display: none; }
  body.cd #bar, body.cd #paused { display: none; }
  body.cd #lcd { display: block; flex: none; padding: 2.2vh 2.2vh 1.8vh; color: #62e6f5; background: #070d10;
    border: .25vh solid #26343a; border-radius: 1.4vh; box-shadow: 0 1.5vh 5vh rgba(0,0,0,.6), inset 0 0 6vh rgba(98,230,245,.05); }
  .row { display: flex; align-items: flex-end; }
  .lab { font-size: 1.6vh; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 1vh; opacity: .85; white-space: nowrap; }
  .dg { display: flex; height: 9vh; transform: skewX(-5deg); transform-origin: bottom; }
  .dg svg { height: 100%; width: auto; margin-right: .8vh; overflow: visible; display: block; filter: drop-shadow(0 0 .8vh rgba(98,230,245,.45)); }
  .dg svg:last-child { margin-right: 0; }
  .dg polygon, .dg rect { fill: #62e6f5; opacity: .07; }
  .dg .on { opacity: 1; }
  #cmode { width: 5vh; height: 5vh; margin: 0 0 2vh 2.4vh; }
  #cmode svg { width: 100%; height: 100%; fill: currentColor; display: none; }
  #cmode[data-m="play"] .p, #cmode[data-m="pause"] .u, #cmode[data-m="stop"] .s { display: block; }
  #ctime { margin-left: auto; text-align: right; }
  #ctime .dg { justify-content: flex-end; }
  #cprog { display: flex; margin: 2vh 0 1.6vh; height: 1.2vh; }
  #cprog i { flex: 1; margin-right: .3vh; background: currentColor; opacity: .1; transform: skewX(-12deg); }
  #cprog i.on { opacity: 1; }
  #cfoot { display: flex; align-items: center; justify-content: space-between; font-size: 2vh; font-variant-numeric: tabular-nums; }
  #ccal { display: flex; overflow: hidden; min-width: 0; }
  #ccal span { min-width: 3.6vh; height: 3.4vh; line-height: 3vh; text-align: center; border: .2vh solid transparent; border-radius: .5vh; }
  #ccal .past { opacity: .25; }
  #ccal .now { border-color: currentColor; font-weight: 700; }
  #cdisc { white-space: nowrap; margin-left: 1.6vh; }
  /* talasni oblik pesme ispod displeja (kad ga AudioCD posalje); displej ostaje isti */
  #cwave { display: none; }
  body.cd.wave #cwave { display: block; flex: none; width: 100%; height: 9vh; margin-top: 1.8vh; padding: 1.4vh 2.2vh;
    background: #070d10; border: .25vh solid #26343a; border-radius: 1.4vh; box-shadow: 0 1.5vh 5vh rgba(0,0,0,.6); }
  body.cd.blink #ctime .dg { animation: blink 1.2s steps(2, jump-none) infinite; }
  @keyframes blink { from { opacity: 1; } to { opacity: .25; } }
</style>
</head>
<body class="idle">
<div id="bg"></div><div id="bg2" style="opacity:0"></div><div id="shade"></div>
<div id="stage">
  <img id="art" alt="">
  <div id="side">
    <div id="meta">
      <div id="title" class="clamp"></div>
      <div id="artist" class="clamp"></div>
      <div id="album" class="clamp"></div>
    </div>
    <canvas id="vu"></canvas>
    <div id="info"></div>
    <div id="bar"><span id="pos">0:00</span><div id="track"><div id="fill"></div></div><canvas id="fwave"></canvas><span id="dur">0:00</span></div>
    <div id="lcd">
      <div class="row">
        <div><div class="lab">Track</div><div class="dg" id="dtrack"></div></div>
        <div id="cmode"><svg class="p" viewBox="0 0 24 24"><path d="M6 3v18l15-9z"/></svg><svg class="u" viewBox="0 0 24 24"><path d="M5 3h5v18H5zM14 3h5v18h-5z"/></svg><svg class="s" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg></div>
        <div id="ctime"><div class="lab">Elapsed</div><div class="dg" id="dtime"></div></div>
      </div>
      <div id="cprog"></div>
      <div id="cfoot"><div id="ccal"></div><div id="cdisc"></div></div>
    </div>
    <canvas id="cwave"></canvas>
  </div>
</div>
<div id="paused">PAUSED</div>
<div id="idle">Lyrion Music Server</div>
<script src="vu-draw.js?v=0.7.2"></script>
<script>
'use strict';
const NS = 'urn:x-cast:lms.nowplaying';
// verzija receiver-a; plugin salje svoju (rv): kad se razlikuju, stranica se ucita ponovo (Chromecast inace
// drzi staru stranicu dok se ekran ne pokrene iznova)
const RV = '0.7.2';
let sender = null;
const $ = id => document.getElementById(id);
let st = { duration: 0, elapsed: 0, at: 0, playing: false };
let curCover = null, bgFront = 'bg';

function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`;
}

function setText(el, pre, txt) {
  el.textContent = '';
  if (!txt) return;
  if (pre) { const p = document.createElement('span'); p.className = 'pre'; p.textContent = pre; el.appendChild(p); }
  el.appendChild(document.createTextNode(txt));
}

function setCover(url) {
  if (!url || url === curCover) return;
  curCover = url;
  const img = new Image();
  img.onload = () => {
    $('art').src = url;
    const back = bgFront === 'bg' ? 'bg2' : 'bg';
    $(back).style.backgroundImage = `url("${url}")`;
    $(back).style.opacity = 1; $(bgFront).style.opacity = 0; bgFront = back;
  };
  img.src = url;
}

// ---- audio CD display
let cd = null;
const last = {};
const SEG = { '0': '1111110', '1': '0110000', '2': '1101101', '3': '1111001', '4': '0110011', '5': '1011011',
  '6': '1011111', '7': '1110000', '8': '1111111', '9': '1111011', '-': '0000001' };
const POLY = ['9,0 51,0 43,9 17,9', '54,3 60,9 60,44 55,49 50,43 50,13', '55,51 60,56 60,91 54,97 50,87 50,57',
  '17,91 43,91 51,100 9,100', '6,97 0,91 0,56 5,51 10,57 10,87', '6,3 10,13 10,43 5,49 0,44 0,9', '13,45 47,45 53,50 47,55 13,55 7,50'];

function changed(key, v) { if (last[key] === v) return false; last[key] = v; return true; }
function two(n) { return String(n).padStart(2, '0'); }
function clock(s) { s = Math.max(0, Math.floor(s || 0)); return two(Math.floor(s / 60)) + ':' + two(s % 60); }

function digits(id, text) {
  if (!changed(id, text)) return;
  $(id).innerHTML = text.split('').map(c => c === ':'
    ? '<svg viewBox="0 0 12 100"><rect class="on" x="1" y="26" width="10" height="11"/><rect class="on" x="1" y="64" width="10" height="11"/></svg>'
    : '<svg viewBox="0 0 60 100">' + POLY.map((p, i) => `<polygon points="${p}"${(SEG[c] || '')[i] === '1' ? ' class="on"' : ''}/>`).join('') + '</svg>').join('');
}

function bars(on) {
  const box = $('cprog');
  while (box.children.length < 80) box.appendChild(document.createElement('i'));
  if (!changed('bars', on)) return;
  for (let i = 0; i < 80; i++) box.children[i].className = i < on ? 'on' : '';
}

function calendar() {
  // at most 12 numbers (fits beside the cover): the group that holds the current track
  const ns = cd.tracks.map(t => t.n), at = Math.max(0, ns.indexOf(cd.track)), from = Math.floor(at / 12) * 12;
  const show = ns.slice(from, from + 12);
  if (!changed('cal', cd.track + '|' + show.join())) return;
  $('ccal').textContent = '';
  for (const n of show) {
    const s = document.createElement('span');
    s.textContent = n; s.className = n === cd.track ? 'now' : n < cd.track ? 'past' : '';
    $('ccal').appendChild(s);
  }
}

// Tanke uspravne crte simetricno oko sredine (kao kod Roon-a), visina po RMS-u; odsvirani deo svetli.
// col: [odsvirano, ostatak dok svira, ostatak u pauzi(, odsvirano u pauzi)]
function drawWave(c, w, key, pos, col) {
  if (!w) return;
  const W = c.clientWidth, H = c.clientHeight;
  if (!W || !H) return;
  const cs = getComputedStyle(c), pl = parseFloat(cs.paddingLeft), pt = parseFloat(cs.paddingTop);
  const iw = W - pl - parseFloat(cs.paddingRight), ih = H - pt - parseFloat(cs.paddingBottom);
  const bars = Math.max(40, Math.floor(iw / 5));
  const played = st.duration ? Math.round(bars * pos / st.duration) : 0;
  if (!changed(c.id, [key, W, H, played, st.playing].join('|'))) return;
  if (c.width !== W) c.width = W;
  if (c.height !== H) c.height = H;
  const g = c.getContext('2d'), n = w.length, max = Math.max(...w) || 1, step = iw / bars, bw = Math.max(1, Math.round(step * .6));
  g.clearRect(0, 0, W, H);
  for (let i = 0; i < bars; i++) {
    const a = Math.floor(i * n / bars), b = Math.max(a + 1, Math.floor((i + 1) * n / bars));
    let v = 0;
    for (let j = a; j < b && j < n; j++) v = Math.max(v, w[j]);
    const h = Math.max(3, Math.round(ih * Math.min(1, v / max)));
    const x = Math.round(pl + i * step), y = Math.round(pt + (ih - h) / 2);
    g.fillStyle = i < played ? (st.playing ? col[0] : col[3] || col[0]) : st.playing ? col[1] : col[2];
    if (g.roundRect) { g.beginPath(); g.roundRect(x, y, bw, h, bw / 2); g.fill(); } else g.fillRect(x, y, bw, h);
  }
}
const CD_WAVE = ['#62e6f5', 'rgba(98,230,245,.28)', 'rgba(98,230,245,.18)'];
const FILE_WAVE = ['#e0835a', 'rgba(255,255,255,.26)', 'rgba(255,255,255,.16)', 'rgba(255,255,255,.55)'];
let fwave = null, fwaveKey = '';

function tickCd(pos) {
  const sum = f => cd.tracks.reduce((a, t) => a + (f(t.n) ? t.length : 0), 0);
  const total = sum(() => true);
  digits('dtrack', two(cd.track));
  digits('dtime', clock(pos));
  bars(st.duration ? Math.round(80 * pos / st.duration) : 0);
  calendar();
  drawWave($('cwave'), cd.wave, cd.waveKey, pos, CD_WAVE);
  const t = total ? clock(sum(n => n < cd.track) + pos) + ' / ' + clock(total) : '';
  if (changed('cdisc', t)) $('cdisc').textContent = t;
}

// ---- VU metar: nivoi stizu u paketima (~3 frejma na 100 ms); rasporedjuju se u vremenu da bi kretanje bilo glatko
let vu = null, vuStyle = '';
function setVu(cfg) {
  const on = !!(cfg && cfg.style && cfg.style !== 'off' && window.VUDraw);
  document.body.classList.toggle('vu', on);
  document.body.classList.toggle('vu-needles', on && cfg.style !== 'bars');
  document.body.classList.toggle('vu-bars', on && cfg.style === 'bars');
  if (!on) { if (vu) { vu.stop(); vu = null; vuStyle = ''; } return; }
  const o = { style: cfg.style, ref: cfg.ref === 'auto' ? 'auto' : +cfg.ref || -14, delay: +cfg.delay || 0, accent: document.body.classList.contains('cd') ? '#62e6f5' : getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() };
  if (!vu) vu = VUDraw.create($('vu'), o); else vu.set(o);
  vuStyle = cfg.style;
}
// nivoi stizu u paketima; svaki frame nosi vreme servisa (a[4]), pa ga vu-draw prikazuje sa stalnim kasnjenjem
function onVu(m) {
  if (!vu || !Array.isArray(m.f)) return;
  const x = Array.isArray(m.x) ? m.x : [];
  m.f.forEach((a, i) => vu.push(Object.assign({ p: [a[0] / 1000, a[1] / 1000], r: [a[2] / 1000, a[3] / 1000], on: 1,
    t: +a[4] || 0, rate: +m.rate || 0 }, x[i] || {})));
}
// merenje kasnjenja: receiver ga svakih 10 s javlja pluginu (castnowplaying vustat)
setInterval(() => {
  if (!vu || !sender || !window.castCtx) return;
  try { window.castCtx.sendCustomMessage(NS, sender, { type: 'vu-stat', rv: RV, ...vu.stats() }); } catch (e) {}
}, 10000);
function checkVersion(rv) {
  if (!rv || rv === RV) return;
  try { if (sessionStorage.getItem('rvTried') === rv) return; sessionStorage.setItem('rvTried', rv); } catch (e) {}
  location.replace(location.pathname + '?rv=' + encodeURIComponent(rv));
}

function render(m) {
  if (m.type === 'vu') { onVu(m); return; }
  checkVersion(m.rv);
  if (m.type === 'idle') { document.body.className = 'idle'; if (vu) { vu.stop(); vu = null; } return; }
  document.body.classList.remove('idle');
  setText($('title'), m.trackNum ? String(m.trackNum).padStart(2, '0') + ' •' : '', m.title || '');
  setText($('artist'), m.artist ? 'by' : '', m.artist || '');
  setText($('album'), m.album ? 'from' : '', m.album ? m.album + (m.year ? ` (${m.year})` : '') : '');
  $('info').textContent = m.info || '';
  setCover(m.cover);
  st = { duration: +m.duration || 0, elapsed: +m.elapsed || 0, at: performance.now(), playing: !!m.playing };
  cd = m.cd && m.cd.track ? { track: +m.cd.track, tracks: (m.cd.tracks || []).map(t => ({ n: +t.n, length: +t.length || 0 })),
    wave: Array.isArray(m.cd.wave) && m.cd.wave.length ? m.cd.wave.map(Number) : null } : null;
  if (cd && cd.wave) cd.waveKey = m.cd.track + ':' + cd.wave.length + ':' + cd.wave.slice(0, 8).join();
  if (cd && m.cd.waiting) st.playing = false;
  document.body.classList.toggle('cd', !!cd);
  document.body.classList.toggle('wave', !!(cd && cd.wave));
  fwave = !cd && Array.isArray(m.wave) && m.wave.length ? m.wave.map(Number) : null;
  fwaveKey = fwave ? (m.title || '') + ':' + fwave.length + ':' + fwave.slice(0, 8).join() : '';
  document.body.classList.toggle('fwave', !!fwave);
  document.body.classList.toggle('blink', !!cd && (m.cd.mode === 'pause' || !!m.cd.waiting));
  if (cd) {
    setText($('title'), '', m.title || '');
    $('cmode').setAttribute('data-m', m.cd.mode || 'play');
  }
  document.body.classList.toggle('paused', !st.playing);
  setVu(m.vu);
  tick();
}

function tick() {
  let pos = st.elapsed;
  if (st.playing) pos += (performance.now() - st.at) / 1000;
  if (st.duration) pos = Math.min(pos, st.duration);
  if (cd) { tickCd(pos); return; }
  $('pos').textContent = fmt(pos);
  $('dur').textContent = fmt(st.duration);
  $('bar').classList.toggle('noprog', !st.duration);
  $('fill').style.width = st.duration ? (100 * pos / st.duration).toFixed(3) + '%' : '0';
  if (fwave) drawWave($('fwave'), fwave, fwaveKey, pos, FILE_WAVE);
}
setInterval(tick, 250);

// slow drift against burn-in on OLED / plasma
let drift = 0;
setInterval(() => { drift = (drift + 1) % 4; const d = [[0,0],[6,4],[0,8],[-6,4]][drift];
  $('stage').style.transform = `translate(${d[0]}px, ${d[1]}px)`; }, 120000);

if (window.cast && cast.framework && /CrKey|Android|AFT|Web0S|Tizen/i.test(navigator.userAgent)) {
  const ctx = cast.framework.CastReceiverContext.getInstance();
  window.castCtx = ctx;
  ctx.addCustomMessageListener(NS, ev => {
    if (ev.senderId) sender = ev.senderId;
    let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { return; } }
    render(m || {});
  });
  const opts = new cast.framework.CastReceiverOptions();
  opts.disableIdleTimeout = true;
  opts.skipPlayersLoad = true;
  opts.statusText = 'Now Playing';
  ctx.start(opts);
} else {
  // plain browser preview: index.html?demo
  window.render = render;
  if (location.search.includes('vu')) {
    let t = 0;
    setTimeout(() => setInterval(() => {
      const f = [];
      for (let k = 0; k < 3; k++) {
        t += 1 / 30;
        const beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2)), 8), env = 0.16 + 0.1 * Math.sin(t / 3) + 0.12 * beat;
        const r = [env * (1 + 0.15 * Math.sin(t * 1.7)), env * (1 + 0.15 * Math.cos(t * 1.3))];
        f.push([...r.map(v => Math.round(1000 * Math.min(1, v * (2.2 + 1.5 * beat)))), ...r.map(v => Math.round(1000 * v)), Date.now() - 100 + k * 33]);
      }
      render({ type: 'vu', fps: 30, f });
    }, 100), 300);
  }
  const demoVu = location.search.includes('vu') ? { style: location.search.includes('bars') ? 'bars' : 'needles', ref: 'auto', delay: 0 } : undefined;
  if (location.search.includes('demo')) render({ vu: demoVu, type: 'track', trackNum: 4, title: 'Basin Street Blues', artist: 'Toshio Oida',
    album: 'It Was a Very Good Year', year: 1976, duration: 248, elapsed: 134, playing: true,
    info: '798kbps VBR, 16bit, 44.1kHz, flc • 4 of 10', cover: location.hash.slice(1),
    wave: location.search.includes('wave') ? Array.from({ length: 400 }, (_, i) => Math.round(250 + 200 * Math.sin(i / 23) * Math.sin(i / 7) + 150 * Math.min(1, i / 30) * Math.min(1, (400 - i) / 30))) : undefined });
  if (location.search.startsWith('?cd')) render({ vu: demoVu, type: 'track', trackNum: 2, title: 'Second Track Title', artist: 'Some Artist feat. Someone',
    album: 'Album Title', year: 2007, duration: 394, elapsed: 183, playing: true, info: '16bit, FLAC \u2022 2 of 10', cover: location.hash.slice(1),
    cd: { track: 2, mode: 'play', waiting: false,
      wave: location.hash.includes('nowave') ? undefined : Array.from({ length: 400 }, (_, i) => Math.round(250 + 200 * Math.sin(i / 23) * Math.sin(i / 7) + 150 * Math.min(1, i / 30) * Math.min(1, (400 - i) / 30))),
      tracks: [456, 394, 459, 327, 497, 396, 344, 448, 452, 301].map((length, i) => ({ n: i + 1, length })) } });
}
</script>
</body>
</html>
